# Sawwi — full stack for local + single-VPS deploy. All services live here.
# Run from the repo root:
#   docker compose up -d --build     # start everything (build images if needed)
#   docker compose down              # stop (keeps volumes / data)
#   docker compose down -v           # stop + wipe data volumes
#   docker compose pull              # pull newer base images (postgres/redis/caddy)
#   docker compose ps                # status
#   docker compose logs -f app       # tail one service
#
# Media storage runs locally as MinIO (S3-compatible); in production this is
# swapped for Cloudflare R2 via env only. Env comes from ./.env (copy
# ./.env.example first); env_file injects it per container.

name: sawwi

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    image: sawwi-app:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "3000" # internal only; reached via the caddy service
    networks:
      - sawwi
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    image: sawwi-worker:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sawwi

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env # provides POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - sawwi
    healthcheck:
      # `$$` escapes compose interpolation so the shell expands it inside the container.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Exposed so `prisma migrate` / a GUI can reach Postgres from the host.
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - sawwi
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    # Exposed so `pnpm dev` on the host can use the queues.
    ports:
      - "127.0.0.1:6379:6379"

  # Local S3-compatible object storage — stands in for Cloudflare R2 in dev.
  # The app talks to it via the S3 API (src/lib/storage.ts), so switching to R2
  # later is only an env change (R2_ENDPOINT / keys), no code change.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    env_file:
      - .env # MINIO_ROOT_USER / MINIO_ROOT_PASSWORD
    volumes:
      - minio_data:/data
    networks:
      - sawwi
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "127.0.0.1:9000:9000" # S3 API  — reached by host `pnpm dev` + browsers
      - "127.0.0.1:9001:9001" # console — open http://localhost:9001

  # One-shot: create the media bucket and make it publicly readable (like an R2
  # public bucket), then exit. Re-running is idempotent.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - .env
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing local/"$${R2_BUCKET}" &&
        mc anonymous set download local/"$${R2_BUCKET}" &&
        echo "✓ bucket $${R2_BUCKET} ready (public read)"
    networks:
      - sawwi

  # Postgres web GUI — browse AND edit rows (inline forms) + run SQL at
  # http://localhost:8081. Dev convenience only; reaches `postgres` internally.
  adminer:
    image: adminer:latest
    restart: unless-stopped
    environment:
      # Pre-fills the "Server" field on the login screen.
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8080" # Adminer serves on 8080 inside the container
    networks:
      - sawwi

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: "500"
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:8025:8025" # web UI — open http://localhost:8025 to read emails
      - "127.0.0.1:1025:1025" # SMTP
    networks:
      - sawwi

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443" # reserved for the later TLS phase
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - sawwi

networks:
  sawwi:
    driver: bridge

volumes:
  pg_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
